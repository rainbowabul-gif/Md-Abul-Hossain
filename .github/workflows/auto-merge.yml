name: Auto Merge PRs

on:
  pull_request_target:
    types: [labeled, opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

env:
  LABEL_NAME: "Confirmed"          # label name to trigger auto-merge (case-sensitive)
  POLL_INTERVAL_MS: "10000"       # how often to poll checks (ms)
  MAX_WAIT_MINUTES: "30"          # how long to wait for checks to finish
  MERGE_METHOD: "merge"           # merge, squash, or rebase
  MERGE_RETRIES: "5"

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge when label present and checks pass
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labelName = process.env.LABEL_NAME || 'Confirmed';
            const pollInterval = parseInt(process.env.POLL_INTERVAL_MS || '10000', 10);
            const maxWaitMinutes = parseInt(process.env.MAX_WAIT_MINUTES || '30', 10);
            const mergeMethod = process.env.MERGE_METHOD || 'merge';
            const mergeRetries = parseInt(process.env.MERGE_RETRIES || '5', 10);

            function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

            // Fetch latest PR data (labels, draft, head sha)
            async function getPr() {
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              return data;
            }

            const pr = await getPr();

            // Check label presence
            const labels = (pr.labels || []).map(l => l.name);
            if (!labels.includes(labelName)) {
              core.info(`Label "${labelName}" not present on PR #${prNumber}. Skipping auto-merge.`);
              return;
            }

            if (pr.draft) {
              core.info(`PR #${prNumber} is a draft. Skipping auto-merge.`);
              return;
            }

            // Wait for check runs and statuses to complete and to pass
            const maxAttempts = Math.ceil((maxWaitMinutes * 60 * 1000) / pollInterval);
            let attempt = 0;
            let readyToMerge = false;

            while (attempt < maxAttempts) {
              attempt++;
              const latest = await getPr();
              const ref = latest.head.sha;

              // If there are merge conflicts or PR is not mergeable, abort
              if (latest.mergeable_state === 'dirty' || latest.mergeable_state === 'blocked') {
                core.info(`PR #${prNumber} has merge conflicts or is blocked (mergeable_state=${latest.mergeable_state}). Aborting auto-merge.`);
                return;
              }

              // Check Checks API
              const checks = await github.rest.checks.listForRef({ owner, repo, ref });
              const runs = checks.data.check_runs || [];

              // Check legacy combined status
              const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref });
              const statuses = combined.data.statuses || [];

              // If any check run is still in progress or queued, wait
              const inProgressRun = runs.find(r => r.status !== 'completed');
              if (inProgressRun) {
                core.info(`Waiting: check run still in progress: ${inProgressRun.name}`);
                await sleep(pollInterval);
                continue;
              }

              // If any check run concluded with failure/cancelled/timed_out, abort
              const failingRun = runs.find(r => r.conclusion && ['failure','cancelled','timed_out','action_required'].includes(r.conclusion));
              if (failingRun) {
                core.info(`Aborting: check run failed: ${failingRun.name} (${failingRun.conclusion}).`);
                return;
              }

              // If statuses contain any pending entries, wait
              const pendingStatus = statuses.find(s => s.state === 'pending');
              if (pendingStatus) {
                core.info(`Waiting: status context "${pendingStatus.context}" is still pending.`);
                await sleep(pollInterval);
                continue;
              }

              // If statuses include any non-success states (failure), abort
              const failedStatus = statuses.find(s => s.state === 'failure');
              if (failedStatus) {
                core.info(`Aborting: status context failed: ${failedStatus.context}`);
                return;
              }

              // All checks are complete and none failed
              readyToMerge = true;
              break;
            }

            if (!readyToMerge) {
              core.info(`Timed out waiting for checks to complete on PR #${prNumber}.`);
              return;
            }

            // Attempt to merge with retries for transient errors
            let mergeAttempt = 0;
            while (mergeAttempt < mergeRetries) {
              mergeAttempt++;
              try {
                const mergeResp = await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: prNumber,
                  merge_method: mergeMethod,
                  commit_title: `Auto-merged PR #${prNumber}`,
                  commit_message: `Auto-merged because label \"${labelName}\" was present and checks passed.`
                });

                if (mergeResp.status === 200) {
                  core.info(`Successfully merged PR #${prNumber}.`);
                  return;
                } else {
                  core.info(`Merge attempt returned status ${mergeResp.status}: ${JSON.stringify(mergeResp.data)}`);
                }
              } catch (err) {
                const msg = err && err.message ? err.message : String(err);
                core.info(`Merge attempt ${mergeAttempt} failed: ${msg}`);

                // If it's a branch-protection or check-failure error, abort (do not retry)
                if (msg.includes('required status check') || msg.includes('must be up to date') || msg.includes('protected branch')) {
                  core.info('Merge blocked by branch protection or required checks. Aborting auto-merge.');
                  throw err;
                }

                // Otherwise wait a bit and retry
                await sleep(2000 * mergeAttempt);
              }
            }

            core.setFailed(`Failed to merge PR #${prNumber} after ${mergeRetries} attempts.`);
