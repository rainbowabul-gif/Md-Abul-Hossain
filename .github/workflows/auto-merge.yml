name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_run:
    types: [completed]
  status:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Auto merge PR
        uses: pascalgn/automerge-action@v0.16.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_METHOD: merge
          MERGE_COMMIT_MESSAGE: auto
          MERGE_RETRIES: 5
          MERGE_RETRY_SLEEP: 10000
